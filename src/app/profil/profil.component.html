<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm fixed-top">
  <div class="container d-flex justify-content-between align-items-center">
    
    <a routerLink="/home" class="navbar-brand d-flex align-items-center">
      <span class="logo-text"><span class="text-success">Ghofy</span></span>
    </a>

 
    <div class="d-flex align-items-center gap-3">
      <button routerLink="/publish-product" class="btn btn-light btn-sm">Add Product</button>
    </div>
  </div>
  
<div *ngIf="userService.isLoggedIn; else login">
  <button class="btn btn-outline-light btn-sm" (click)="showLogoutModal = true">Log out</button>
</div>

<!-- Modal de déconnexion -->
<div *ngIf="showLogoutModal" class="modal-overlay">
  <div class="modal-content">
    <h2>Êtes-vous sûr de vouloir vous déconnecter ?</h2>
    <div class="d-flex justify-content-center gap-3 mt-3">
      <button class="btn btn-primary" (click)="logout()">Oui</button>
      <button class="btn btn-secondary" (click)="cancelLogout()">Non</button>
    </div>
  </div>
</div>

<ng-template #login>
  <button class="btn btn-outline-light btn-sm" (click)="redirectToLogin()">Log in or Sign Up</button>
</ng-template>

</nav>

<!-- Profile Section -->
<div class="container mt-5 pt-5 profile-container">
  <div class="profile-header text-center">
    <!-- Profile Picture -->
    <div class="profile-picture">
      <img
        id="profileImage"
        [src]="'https://ui-avatars.com/api/?name=' + firstName + '+' + lastName + '&background=random'"
        class="rounded-circle border border-3 border-success"
        style="width: 120px; height: 120px; object-fit: cover;"
      />
      <p class="mt-3"><strong>Nom:</strong> {{ firstName }} {{ lastName }}</p>
      <p><strong>Téléphone:</strong> {{ phoneNumber }}</p>
      <p><strong>Adresse:</strong> {{ address }}</p>
    </div>
  </div>
</div>

<!-- Posts Section -->
<div class="container mt-4">
  <div class="row">
    <div *ngFor="let product of userProducts" class="col-md-4 mb-4">
      <div class="card product-card">
        <img *ngIf="product.images && product.images[0]?.url" 
             [src]="product.images[0].url" 
             [alt]="product.name" 
             class="card-img-top product-image" />
        <div class="card-body product-info">
          <h3 class="card-title">{{ product.name }}</h3>
          <p class="card-text description">{{ product.description }}</p>
          <p class="card-text price">{{ product.price }} €</p>
          <div class="button-group">
            <button class="btn btn-danger delete-button" (click)="onDelete(product.id ? product.id : '')">Supprimer</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
